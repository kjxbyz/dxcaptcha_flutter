name: dxcaptcha_flutter
description: "顶象无感验证码（DingXiang Captcha）Flutter 插件，支持 iOS / Android，提供嵌入 Widget 与弹窗两种接入方式。"
version: 0.0.2-dev.1
homepage: https://github.com/kjxbyz/dxcaptcha_flutter

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kjxbyz.plugins.dxcaptcha_flutter
        pluginClass: DxcaptchaFlutterPlugin
      ios:
        pluginClass: DxcaptchaFlutterPlugin
